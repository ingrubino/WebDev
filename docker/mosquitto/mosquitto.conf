# Broker MQTT per la pagina SCADA e il gateway Python (vue/canbus, topic in vue/canbus/TOPICS.md).
# Accesso anonimo: pensato per una rete locale. Per proteggerlo vedi password_file nella
# documentazione di Mosquitto.

persistence false
log_dest stdout

# MQTT classico: gateway Python e strumenti di debug (mosquitto_sub/pub)
listener 1883
allow_anonymous true

# WebSocket per il browser, inoltrato da nginx su /mqtt
listener 9001
protocol websockets
