# Configurazione di sviluppo: / -> server Vite (hot reload), /api -> PHP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 20m;

    location /api/ {
        set $api http://api:80;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location / {
        set $vite http://vite:5173;
        proxy_pass $vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # websocket per l'hot reload
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
