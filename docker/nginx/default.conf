# Usa il DNS interno di Docker: nginx parte anche se "api" non e' ancora pronto.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 20m;   # upload CSV/XML
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Backend PHP: /api/... -> http://api/api/...
    location /api/ {
        set $api http://api:80;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MQTT su WebSocket per la pagina SCADA: /mqtt -> broker mqtt:9001
    location /mqtt {
        set $mqtt http://mqtt:9001;
        proxy_pass $mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;      # connessione aperta finché la pagina resta aperta
    }

    # File generati da Vite (nome con hash): cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single Page Application: ogni altra rotta torna a index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
